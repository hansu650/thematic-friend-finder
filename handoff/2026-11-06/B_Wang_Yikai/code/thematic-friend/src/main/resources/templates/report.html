<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{ui.submit_a_report})}"></head><body><aside th:replace="~{fragments/layout :: sidebar('safety')}"></aside>
<div class="app-language"><nav th:replace="~{fragments/layout :: language}"></nav></div>
<main class="app-main narrow-main"><a class="back-link" th:href="@{/safety}"><th:block th:text="#{ui.privacy_and_safety_alternate}">← Privacy and safety</th:block> </a><header class="page-heading"><div><p class="eyebrow">LET US KNOW</p><h1><th:block th:text="#{ui.tell_us_what_happened}">Tell us what happened.</th:block> </h1><p><th:block th:text="#{ui.reporting}">Reporting:</th:block> <strong th:text="${target.nickname}"></strong></p></div></header><section class="panel"><form class="stack-form" th:action="@{/reports/{id}(id=${target.id})}" method="post"><label for="reason"><th:block th:text="#{ui.reason}">Reason</th:block> </label><select id="reason" name="reason" required><option th:each="reason : ${reasons}" th:value="${reason}" th:text="${@i18n.option(reason)}"></option></select><label for="details"><th:block th:text="#{ui.details}">Details</th:block> </label><textarea id="details" name="details" maxlength="1000" rows="5" th:placeholder="#{ui.describe_what_happened_leave_out_sensitive_information}"></textarea><p class="fine"><th:block th:text="#{ui.reports_are_saved_locally_for_the_course_demonstration_block_the_person_to_stop_contact_im}">Reports are saved locally for the course demonstration. Block the person to stop contact immediately.</th:block> </p><button class="button" type="submit"><th:block th:text="#{ui.save_report}">Save report</th:block> </button></form></section></main></body></html>
