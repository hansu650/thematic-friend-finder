<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{ui.connections})}"></head><body><aside th:replace="~{fragments/layout :: sidebar('connections')}"></aside>
<div class="app-language"><nav th:replace="~{fragments/layout :: language}"></nav></div>
<main class="app-main"><header class="page-heading"><div><p class="eyebrow">YOUR CONNECTIONS</p><h1><th:block th:text="#{ui.keep_the_conversation_going}">Keep the conversation going.</th:block> </h1><p class="muted"><th:block th:text="#{ui.every_connection_here_starts_with_a_mutual_choice}">Every connection here starts with a mutual choice.</th:block> </p></div></header><div th:replace="~{fragments/layout :: notice}"></div>
<section th:if="${contacts.isEmpty()}" class="panel empty-state"><span class="empty-symbol" aria-hidden="true">♡</span><h2><th:block th:text="#{ui.your_next_conversation_is_on_its_way}">Your next conversation is on its way.</th:block> </h2><p><th:block th:text="#{ui.like_someone_in_discover_when_they_like_you_back_you_can_chat}">Like someone in Discover. When they like you back, you can chat.</th:block> </p><a class="button" th:href="@{/discover}"><th:block th:text="#{ui.discover_people}">Discover people</th:block> </a></section>
<section class="contact-list" th:aria-label="#{ui.mutual_connections}"><a class="panel contact-row" th:each="contact : ${contacts}" th:href="@{/conversations/{id}(id=${contact.link.id})}"><span class="avatar" th:classappend="'palette-' + ${contact.partner.palette}" th:text="${contact.partner.initial}"></span><div><h2 th:text="${contact.partner.nickname}"></h2><p th:text="${contact.preview.isEmpty() ? @i18n.text('chat.first_message') : contact.preview}"></p></div><span aria-hidden="true">↗</span></a></section></main></body></html>
