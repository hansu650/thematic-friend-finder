<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{ui.join_mingle})}"></head><body>
<header th:replace="~{fragments/layout :: publicNav}"></header>
<main class="auth-layout"><section class="auth-intro"><p class="eyebrow">A LITTLE IN COMMON</p><h1><th:block th:text="#{ui.share_what}">Share what</th:block> <br><th:block th:text="#{ui.you_love_with}">you love with</th:block> <span><th:block th:text="#{ui.your_kind_of_people}">your kind of people.</th:block> </span></h1><p><th:block th:text="#{ui.a_little_about_you_is_a_good_place_to_start}">A little about you is a good place to start.</th:block> </p><div class="auth-symbol" aria-hidden="true">m<span>·</span></div></section>
<section class="panel auth-panel"><h2><th:block th:text="#{ui.create_your_account}">Create your account</th:block> </h2><p class="muted"><th:block th:text="#{ui.please_use_fictional_details_for_this_course_prototype}">Please use fictional details for this course prototype.</th:block> </p>
<form th:action="@{/signup}" th:object="${signupForm}" method="post" class="stack-form">
<label for="username"><th:block th:text="#{ui.username}">Username</th:block> </label><input id="username" th:field="*{username}" autocomplete="username" required minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" th:placeholder="#{ui.3_24_letters_numbers_or_underscores}"><span class="field-error" th:errors="*{username}"></span>
<label for="nickname"><th:block th:text="#{ui.display_name}">Display name</th:block> </label><input id="nickname" th:field="*{nickname}" required maxlength="30" autocomplete="nickname" th:placeholder="#{ui.a_name_you_like}"><span class="field-error" th:errors="*{nickname}"></span>
<label for="password"><th:block th:text="#{ui.password}">Password</th:block> </label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="64" required th:placeholder="#{ui.at_least_10_characters}"><span class="field-error" th:errors="*{password}"></span>
<label class="check-label"><input type="checkbox" th:field="*{adult}" required><span><th:block th:text="#{ui.i_am_18_or_over_and_have_read_the}">I am 18 or over and have read the</th:block> <a th:href="@{/privacy}"><th:block th:text="#{ui.prototype_and_privacy_information}">prototype and privacy information</th:block> </a></span></label><span class="field-error" th:errors="*{adult}"></span>
<button class="button full" type="submit"><th:block th:text="#{ui.create_account}">Create account</th:block> <span aria-hidden="true">↗</span></button>
</form><p class="auth-switch"><th:block th:text="#{ui.already_a_member}">Already a member?</th:block> <a th:href="@{/login}"><th:block th:text="#{ui.sign_in}">Sign in</th:block> </a></p></section></main></body></html>
