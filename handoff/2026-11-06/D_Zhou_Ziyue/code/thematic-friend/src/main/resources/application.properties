spring.application.name=thematic-friend
server.address=${APP_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${APP_DATA_DIR:./.local/data}/tongpin;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.demo-password=${TONGPIN_DEMO_PASSWORD:}
spring.messages.fallback-to-system-locale=false
app.chinese-enabled=${TONGPIN_CHINESE_ENABLED:true}
