{% extends "base.html" %}
{% block title %}登录 · 同频{% endblock %}
{% block content %}<section class="account-layout"><p class="eyebrow">WELCOME BACK</p><h1>很高兴，又见到你<span class="coral-dot">.</span></h1><p class="muted">登录后，继续你的新连接。</p><form method="post" class="account-form">{% csrf_token %}{% include "social/fields.html" %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button full-width" type="submit">登录</button></form><p class="account-tail">还没有账号？<a href="{% url 'signup' %}">创建账号</a></p>{% if demo_mode %}<a href="{% url 'welcome' %}" class="text-link">也可以先体验本地演示 ↗</a>{% endif %}</section>{% endblock %}
