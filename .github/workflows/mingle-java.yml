name: Mingle Java CI

on:
  pull_request:
    paths:
      - 'code/thematic-friend/**'
      - '.github/workflows/mingle-java.yml'
  push:
    branches: [main]
    paths:
      - 'code/thematic-friend/**'
      - '.github/workflows/mingle-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/thematic-friend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run Java tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  backup-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: code/thematic-friend
    steps:
      - uses: actions/checkout@v4
      - name: Verify backup, restore and Windows PowerShell UTF-8 handling
        run: ./scripts/tests/BackupRestore.Tests.ps1 -SkipBuild
