name: Mingle Java CI

on:
  pull_request:
    paths:
      - 'code/thematic-friend/**'
      - '.github/workflows/mingle-java.yml'
  push:
    branches: [main]
    paths:
      - 'code/thematic-friend/**'
      - '.github/workflows/mingle-java.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/thematic-friend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run Java tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
