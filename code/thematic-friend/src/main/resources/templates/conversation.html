<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{chat.title(${partner.nickname})})}"></head><body class="mingle-app conversation-page"><aside th:replace="~{fragments/layout :: sidebar('connections')}"></aside>
<div class="app-language"><nav th:replace="~{fragments/layout :: language}"></nav></div>
<main class="app-main chat-main"><a class="back-link" th:href="@{/connections}"><th:block th:text="#{ui.connections_alternate}">← Connections</th:block> </a><div th:replace="~{fragments/layout :: notice}"></div>
<section class="chat-panel panel"><header class="chat-heading"><span class="avatar small" th:classappend="'palette-' + ${partner.palette}" th:text="${partner.initial}"></span><div><h1 th:text="${partner.nickname}"></h1><p><th:block th:text="#{ui.start_with_a_shared_interest}">Start with a shared interest</th:block> </p></div><details class="chat-menu"><summary><th:block th:text="#{ui.more}">More</th:block> </summary><a th:href="@{/reports/{id}(id=${partner.id})}"><th:block th:text="#{ui.report}">Report</th:block> </a><form th:action="@{/connections/{id}/end(id=${connection.id})}" method="post" th:data-confirm="#{ui.end_this_connection_neither_of_you_will_be_able_to_use_this_conversation_again}"><button class="quiet danger" type="submit"><th:block th:text="#{ui.end_connection}">End connection</th:block> </button></form><form th:action="@{/blocks/{id}(id=${partner.id})}" method="post" th:data-confirm="#{ui.block_this_person_and_stop_contact}"><button class="quiet danger" type="submit"><th:block th:text="#{ui.block_person}">Block person</th:block> </button></form></details></header>
<p class="chat-start"><th:block th:text="#{ui.you_both_liked_each_other_say_hello}">You both liked each other. Say hello.</th:block> </p>
<div class="message-history"><button class="quiet" type="button" id="load-older" th:if="${messages.size() >= 100}" th:attr="data-url=@{/api/conversations/{id}/history(id=${connection.id})},data-loading=#{ui.loading_older_messages}"><th:block th:text="#{ui.load_older_messages}">Load older messages</th:block></button></div>
<div class="messages" id="messages" th:data-empty="#{ui.write_a_message_before_sending}" th:data-expired="#{ui.your_session_has_expired_please_sign_in_again}" th:data-closed="#{ui.this_conversation_is_closed_you_cannot_send_or_receive_messages}" th:data-polling="#{ui.checking_for_new_messages_every_3_seconds}" th:data-retry="#{ui.connection_interrupted_trying_again_shortly}" role="log" th:aria-label="#{ui.conversation_messages}" aria-live="polite" th:attr="data-url=@{/api/conversations/{id}/messages(id=${connection.id})},data-read-url=@{/api/conversations/{id}/read(id=${connection.id})},data-csrf=${_csrf.token},data-csrf-header=${_csrf.headerName},data-cursor=${cursor}"><div class="message" th:each="message : ${messages}" th:classappend="${message.mine} ? 'mine'" th:attr="data-message-id=${message.id}"><p th:text="${message.body}"></p><time th:text="${message.time}"></time></div></div>
<p class="chat-status" id="chat-status" role="status"><th:block th:text="#{ui.checking_for_new_messages_every_3_seconds}">Checking for new messages every 3 seconds</th:block> </p><div class="form-error" th:if="${messageError}" th:text="${@i18n.text(messageError)}" role="alert"></div>
<form id="message-form" class="message-form" th:action="@{/conversations/{id}/messages(id=${connection.id})}" method="post"><label class="sr-only" for="body"><th:block th:text="#{ui.message}">Message</th:block> </label><textarea id="body" name="body" maxlength="1000" rows="2" required th:placeholder="#{ui.share_a_little_moment_from_your_day}"></textarea><button class="button" type="submit"><th:block th:text="#{ui.send}">Send</th:block> <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></form></section><p class="fine"><th:block th:text="#{ui.be_respectful_you_can_end_the_connection_block_or_report_at_any_time}">Be respectful. You can end the connection, block or report at any time.</th:block> </p></main>
<script th:src="@{/js/chat.js}" defer></script></body></html>
