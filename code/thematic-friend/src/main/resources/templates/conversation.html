<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{chat.title(${partner.nickname})})}"></head><body class="mingle-app conversation-page"><aside th:replace="~{fragments/layout :: sidebar('connections')}"></aside>
<div class="app-language"><nav th:replace="~{fragments/layout :: language}"></nav></div>
<main class="app-main chat-main"><a class="back-link" th:href="@{/connections}"><th:block th:text="#{ui.connections_alternate}">← Connections</th:block> </a><div th:replace="~{fragments/layout :: notice}"></div>
<div class="messenger-workspace"><aside th:replace="~{fragments/conversation-list :: contacts}"></aside><section class="chat-panel"><header class="chat-heading"><a class="chat-back" th:href="@{/connections}" th:aria-label="#{ui.messages}"><svg th:replace="~{fragments/layout :: icon('chevron-left')}"></svg></a><span class="avatar small" th:classappend="'palette-' + ${partner.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(partner)} : '')" th:text="${partner.initial}"></span><div><h1 th:text="${partner.nickname}"></h1><p><th:block th:text="#{ui.start_with_a_shared_interest}">Start with a shared interest</th:block> </p></div><details class="chat-menu"><summary><th:block th:text="#{ui.more}">More</th:block> </summary><a th:href="@{/reports/{id}(id=${partner.id})}"><th:block th:text="#{ui.report}">Report</th:block> </a><form th:action="@{/connections/{id}/end(id=${connection.id})}" method="post" th:data-confirm="#{ui.end_this_connection_neither_of_you_will_be_able_to_use_this_conversation_again}"><button class="quiet danger" type="submit"><th:block th:text="#{ui.end_connection}">End connection</th:block> </button></form><form th:action="@{/blocks/{id}(id=${partner.id})}" method="post" th:data-confirm="#{ui.block_this_person_and_stop_contact}"><button class="quiet danger" type="submit"><th:block th:text="#{ui.block_person}">Block person</th:block> </button></form></details></header>
<div class="conversation-intro"><div class="conversation-pair" aria-hidden="true"><span class="avatar" th:classappend="'palette-' + ${me.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(me)} : '')" th:text="${me.initial}"></span><span class="avatar" th:classappend="'palette-' + ${partner.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(partner)} : '')" th:text="${partner.initial}"></span></div><div><strong th:text="${partner.nickname}"></strong><p th:text="${@i18n.option(partner.goal)}"></p></div></div><p class="chat-start"><th:block th:text="#{ui.you_both_liked_each_other_say_hello}">You both liked each other. Say hello.</th:block> </p>
<div class="message-history"><button class="quiet" type="button" id="load-older" th:if="${messages.size() >= 100}" th:attr="data-url=@{/api/conversations/{id}/history(id=${connection.id})},data-loading=#{ui.loading_older_messages}"><th:block th:text="#{ui.load_older_messages}">Load older messages</th:block></button></div>
<div class="messages pl-messages" id="messages" th:data-empty="#{ui.write_a_message_before_sending}" th:data-expired="#{ui.your_session_has_expired_please_sign_in_again}" th:data-closed="#{ui.this_conversation_is_closed_you_cannot_send_or_receive_messages}" th:data-polling="#{experience.messages_ready}" th:data-retry="#{ui.connection_interrupted_trying_again_shortly}" th:data-sending="#{experience.sending}" th:data-send-failed="#{experience.send_failed}" role="log" th:aria-label="#{ui.conversation_messages}" aria-live="polite" aria-relevant="additions" th:attr="data-url=@{/api/conversations/{id}/messages(id=${connection.id})},data-read-url=@{/api/conversations/{id}/read(id=${connection.id})},data-csrf=${_csrf.token},data-csrf-header=${_csrf.headerName},data-cursor=${cursor}">
  <div class="message" th:each="message : ${messages}" th:classappend="${message.mine} ? 'mine'" th:attr="data-message-id=${message.id}" th:with="sticker=${@stickers.find(message.body)}">
    <p th:if="${sticker == null}" th:text="${message.body}"></p>
    <p class="sticker-bubble" th:if="${sticker != null}" th:attr="data-sticker=${sticker.id}"><svg class="sticker-art" aria-hidden="true"><use th:href="@{/images/mingle-stickers.svg} + '#' + ${sticker.id}"></use></svg><span class="sticker-caption" th:text="${#locale.language == 'zh' ? sticker.zh : sticker.en}"></span></p>
    <time th:text="${message.time}"></time>
  </div>
</div>
<p class="chat-status" id="chat-status" role="status" th:text="#{experience.messages_ready}">Messages stay in sync</p><div class="form-error" th:if="${messageError}" th:text="${@i18n.text(messageError)}" role="alert"></div>
<div class="composer-shell">
  <div class="composer-toolbar" hidden><button type="button" id="emoji-toggle" aria-expanded="false" aria-controls="emoji-popover"><svg th:replace="~{fragments/layout :: icon('smile')}"></svg><span th:text="#{experience.emoji_picker}">Emoji &amp; stickers</span></button><span class="composer-tip" th:text="#{experience.composer_tip}">Enter to send · Shift + Enter for a new line</span></div>
  <div class="emoji-popover" id="emoji-popover" hidden>
    <div class="emoji-tabs" role="tablist" th:aria-label="#{experience.emoji_picker}"><button type="button" id="emoji-tab" role="tab" class="selected" aria-selected="true" aria-controls="emoji-panel" data-picker-tab="emoji" th:text="#{experience.emoji}">Emoji</button><button type="button" id="sticker-tab" role="tab" aria-selected="false" aria-controls="sticker-panel" tabindex="-1" data-picker-tab="sticker" th:text="#{experience.stickers}">Mingle stickers</button></div>
    <div role="tabpanel" id="emoji-panel" aria-labelledby="emoji-tab"><p class="picker-hint" th:text="#{experience.emoji_help}"></p><div class="emoji-grid" id="emoji-grid"></div></div>
    <div role="tabpanel" id="sticker-panel" aria-labelledby="sticker-tab" hidden><p class="picker-hint" th:text="#{experience.sticker_help}"></p><div class="sticker-grid"><button type="button" th:each="sticker : ${@stickers.all()}" th:attr="data-sticker-id=${sticker.id},data-sticker-label=${#locale.language == 'zh' ? sticker.zh : sticker.en},data-sticker-preview=${sticker.emoji},aria-label=#{experience.sticker_send(${#locale.language == 'zh' ? sticker.zh : sticker.en})}"><svg class="sticker-art" aria-hidden="true"><use th:href="@{/images/mingle-stickers.svg} + '#' + ${sticker.id}"></use></svg><span th:text="${#locale.language == 'zh' ? sticker.zh : sticker.en}"></span></button></div></div>
  </div>
  <form id="message-form" class="message-form" th:action="@{/conversations/{id}/messages(id=${connection.id})}" method="post"><label class="sr-only" for="body" th:text="#{ui.message}">Message</label><textarea class="pl-input" id="body" name="body" maxlength="1000" rows="2" required th:placeholder="#{ui.share_a_little_moment_from_your_day}"></textarea><button class="button pl-button" type="submit"><span th:text="#{ui.send}">Send</span><svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></form>
</div></section></div><p class="fine" th:text="#{ui.be_respectful_you_can_end_the_connection_block_or_report_at_any_time}">Be respectful. You can end the connection, block or report at any time.</p></main>
<script th:src="@{/js/chat.js}" defer></script></body></html>
