<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/reference :: head(${#locale.language == 'zh' ? '发现' : 'Explore'})}"></head><body class="mingle-app explore-page">
<header th:replace="~{fragments/reference :: appNav('explore')}"></header>
<main class="app-main">
 <header class="page-heading"><h1 th:text="${#locale.language == 'zh' ? '找到你的同好。' : 'Find your people.'}"></h1><a class="button" th:href="@{/discover}"><svg th:replace="~{fragments/layout :: icon('person')}"></svg><span th:text="${#locale.language == 'zh' ? '认识新朋友' : 'Meet people'}"></span></a></header>
 <nav class="feed-filters" th:aria-label="#{ui.interest}"><a class="topic-pill" th:classappend="${selectedInterest.isEmpty()} ? 'selected'" th:href="@{/explore}" th:text="${#locale.language == 'zh' ? '全部' : 'All'}"></a><a class="topic-pill" th:each="item : ${allInterests}" th:classappend="${selectedInterest == item} ? 'selected'" th:href="@{/explore(interest=${item})}" th:text="${@i18n.option(item)}"></a></nav>
 <section class="feed-section" th:if="${events != null}"><div class="section-heading"><h2 th:text="${#locale.language == 'zh' ? '一起参加活动' : 'Events near you'}"></h2><a th:href="@{/events(category=${selectedInterest})}" th:text="${#locale.language == 'zh' ? '查看全部' : 'See all events'}"></a></div><div class="event-grid"><th:block th:each="item : ${events}"><a th:replace="~{fragments/event-card :: card(${item})}"></a></th:block><div class="feed-empty" th:if="${events.isEmpty()}"><h2 th:text="${#locale.language == 'zh' ? '这个主题还没有活动。' : 'No events for this topic yet.'}"></h2><a class="button secondary" th:href="@{/events/new}" th:text="${#locale.language == 'zh' ? '发起活动' : 'Create an event'}"></a></div></div></section>
 <section class="feed-section"><div class="section-heading"><h2 th:text="${#locale.language == 'zh' ? '认识新朋友' : 'People to meet'}"></h2><a th:href="@{/discover(interest=${selectedInterest})}" th:text="${#locale.language == 'zh' ? '查看全部' : 'See all people'}"></a></div><div class="people-grid"><a class="people-card" th:each="item : ${stars}" th:id="'star-profile-' + ${item.member.id}" th:href="@{/discover(member=${item.member.id},interest=${selectedInterest})}"><div class="card-cover" th:classappend="'palette-' + ${item.member.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(item.member)} : '')"><span th:text="${item.member.initial}"></span></div><h3 th:text="${item.member.nickname}"></h3><p class="card-location" th:text="${@i18n.option(item.member.goal)}"></p><div class="card-meta" th:if="${!item.shared.isEmpty()}"><span th:text="${@i18n.join(item.shared)}"></span></div></a><div class="feed-empty" th:if="${stars.isEmpty()}"><h2 th:text="#{ui.you_are_all_caught_up}"></h2><a class="button secondary" th:href="@{/discover(interest=${selectedInterest})}" th:text="${#locale.language == 'zh' ? '查看筛选与暂时跳过的人' : 'Review filters and skipped profiles'}"></a></div></div></section>
</main></body></html>
