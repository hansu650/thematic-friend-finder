<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><aside th:fragment="contacts" class="conversation-list-pane"><header><a th:href="@{/connections}" th:text="#{ui.messages}">Messages</a><span class="fine" th:text="${contacts.size()}"></span></header><div class="contact-search"><svg th:replace="~{fragments/layout :: icon('search')}"></svg><label class="sr-only" for="contact-search" th:text="#{ui.search_connections}"></label><input id="contact-search" type="search" autocomplete="off" th:placeholder="#{ui.search_connections}"></div><nav th:aria-label="#{ui.mutual_connections}"><a class="messenger-contact" th:each="contact : ${contacts}" th:href="@{/conversations/{id}(id=${contact.link.id})}" th:classappend="${contact.link.id == connection.id} ? 'selected'" th:attr="data-contact-name=${contact.partner.nickname},data-unread=${contact.unreadCount},aria-current=${contact.link.id == connection.id ? 'page' : null}"><span class="avatar " th:classappend="'palette-' + ${contact.partner.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(contact.partner)} : '')" th:text="${contact.partner.initial}"></span><span><strong th:text="${contact.partner.nickname}"></strong><small th:text="${contact.preview.isEmpty() ? @i18n.text('chat.first_message') : @stickers.preview(contact.preview, #locale.language)}"></small></span><b class="unread-badge" th:if="${contact.unreadCount > 0}" th:text="${contact.unreadCount}"></b></a></nav><p id="contact-no-results" class="contact-no-results" hidden role="status" th:text="#{ui.no_matching_conversations}"></p></aside></body></html>
