<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title == 'Mingle' ? 'Mingle' : title + ' · Mingle'}">Mingle</title>
<link rel="stylesheet" th:href="@{/css/reference-ui.css}"><script th:src="@{/js/reference-ui.js}" defer></script><script th:src="@{/js/reference-motion.js}"></script><script th:src="@{/js/app.js}" defer></script><script th:src="@{/js/mingle-ui.js}" defer></script>
</head><body>
<header th:fragment="publicNav" class="public-header">
 <a class="public-wordmark" th:href="@{/}" aria-label="Mingle home">Mingle</a>
 <nav class="capsule-nav" th:aria-label="#{ui.main_navigation}">
  <a th:href="@{/discover}" th:text="${#locale.language == 'zh' ? '认识' : 'Meet'}">Meet</a>
  <a th:href="@{/events}" th:text="${#locale.language == 'zh' ? '活动' : 'Events'}">Events</a>
  <a th:href="@{/connections}" th:text="#{ui.messages}">Messages</a>
  <a th:href="@{/safety}" th:text="#{ui.safety_short}">Safety</a>
  <details class="nav-dropdown"><summary th:text="${#locale.language == 'zh' ? '我的' : 'Account'}">Account</summary><div><a th:if="${me == null}" th:href="@{/login}" th:text="#{ui.sign_in}">Sign in</a><a th:if="${me == null}" th:href="@{/signup}" th:text="#{ui.create_account}">Create account</a><a th:if="${me != null}" th:href="@{/profile}" th:text="#{ui.my_profile}">My profile</a><a th:href="@{/privacy}" th:text="${#locale.language == 'zh' ? '隐私说明' : 'Privacy'}">Privacy</a></div></details>
 </nav>
 <div class="header-tools"><nav th:replace="~{fragments/layout :: language}"></nav><details th:replace="~{fragments/reference :: mobileMenu}"></details></div>
</header>
<details th:fragment="mobileMenu" class="mobile-nav"><summary th:aria-label="${#locale.language == 'zh' ? '打开导航' : 'Open menu'}"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg></summary><nav th:aria-label="${#locale.language == 'zh' ? '菜单' : 'Menu'}"><a th:href="@{/explore}" th:text="${#locale.language == 'zh' ? '发现' : 'Explore'}"></a><a th:href="@{/discover}" th:text="${#locale.language == 'zh' ? '认识新朋友' : 'Meet people'}"></a><a th:href="@{/events}" th:text="${#locale.language == 'zh' ? '活动' : 'Events'}"></a><a th:href="@{/connections}" th:text="#{ui.messages}"></a><a th:href="@{/safety}" th:text="#{ui.safety_short}"></a><a th:if="${me != null}" th:href="@{/profile}" th:text="#{ui.my_profile}"></a><a th:if="${me == null}" th:href="@{/login}" th:text="#{ui.sign_in}"></a><a th:if="${me == null}" th:href="@{/signup}" th:text="#{ui.create_account}"></a><div th:replace="~{fragments/layout :: language}"></div></nav></details>
<header th:fragment="appNav(active)" class="site-header">
 <a class="site-wordmark" th:href="@{/}" aria-label="Mingle home"><span class="site-mark" aria-hidden="true">m</span>Mingle</a>
 <form class="site-search" th:action="@{/events}" method="get" role="search"><label class="sr-only" for="site-query" th:text="${#locale.language == 'zh' ? '搜索活动' : 'Search events'}"></label><input id="site-query" name="q" maxlength="120" th:value="${query}" th:placeholder="${#locale.language == 'zh' ? '搜索活动…' : 'Search events…'}"><label class="sr-only" for="site-city" th:text="${#locale.language == 'zh' ? '城市' : 'City'}"></label><input id="site-city" name="city" maxlength="60" th:value="${city}" th:placeholder="${#locale.language == 'zh' ? '街区或城市' : 'Neighborhood or city'}"><button class="button" type="submit" th:aria-label="${#locale.language == 'zh' ? '搜索' : 'Search'}"><svg th:replace="~{fragments/layout :: icon('search')}"></svg></button></form>
 <nav class="site-links" th:aria-label="#{ui.main_navigation}"><a th:href="@{/explore}" th:attr="aria-current=${active == 'explore' ? 'page' : null}" th:text="${#locale.language == 'zh' ? '发现' : 'Explore'}"></a><a th:href="@{/events}" th:attr="aria-current=${active == 'events' ? 'page' : null}" th:text="${#locale.language == 'zh' ? '活动' : 'Events'}"></a><a th:href="@{/connections}" th:attr="aria-current=${active == 'connections' ? 'page' : null}" th:text="#{ui.messages}"></a><a th:href="@{/safety}" th:attr="aria-current=${active == 'safety' ? 'page' : null}" th:text="#{ui.safety_short}"></a></nav>
 <div class="header-tools"><nav th:replace="~{fragments/layout :: language}"></nav><details class="site-account" th:if="${me != null}"><summary th:aria-label="#{ui.my_profile}"><span class="avatar" th:classappend="'palette-' + ${me.palette} + (${demoMode} ? ' ' + ${@referencePhotos.css(me)} : '')" th:text="${me.initial}"></span></summary><div><a th:href="@{/profile}" th:text="#{ui.my_profile}"></a><a th:href="@{/events(view='going')}" th:text="${#locale.language == 'zh' ? '我报名的活动' : 'My events'}"></a><a th:href="@{/events(view='saved')}" th:text="${#locale.language == 'zh' ? '我的收藏' : 'Saved events'}"></a><a th:href="@{/change-password}" th:text="#{ui.change_password}"></a><form th:action="@{/logout}" method="post"><button type="submit" th:text="#{ui.sign_out}"></button></form></div></details><details th:replace="~{fragments/reference :: mobileMenu}"></details></div>
</header>
<footer th:fragment="footer" class="public-footer"><a class="public-wordmark" th:href="@{/}">Mingle</a><div class="footer-links"><nav><strong th:text="${#locale.language == 'zh' ? '一起发现' : 'Discover'}"></strong><a th:href="@{/discover}" th:text="${#locale.language == 'zh' ? '认识新朋友' : 'Meet people'}"></a><a th:href="@{/events}" th:text="${#locale.language == 'zh' ? '线下活动' : 'In person'}"></a><a th:href="@{/connections}" th:text="#{ui.messages}"></a></nav><nav><strong th:text="${#locale.language == 'zh' ? '你的空间' : 'Your space'}"></strong><a th:href="@{/profile}" th:text="#{ui.my_profile}"></a><a th:href="@{/events(view='saved')}" th:text="${#locale.language == 'zh' ? '已收藏' : 'Saved events'}"></a><a th:href="@{/events/new}" th:text="${#locale.language == 'zh' ? '发起活动' : 'Create an event'}"></a></nav><nav><strong th:text="${#locale.language == 'zh' ? '关于' : 'About'}"></strong><a th:href="@{/safety}" th:text="#{ui.safety_short}"></a><a th:href="@{/privacy}" th:text="${#locale.language == 'zh' ? '隐私说明' : 'Privacy'}"></a><a th:href="@{/login}" th:text="#{ui.sign_in}"></a></nav></div></footer>
</body></html>
