<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/reference :: head(${#locale.language == 'zh' ? '发起活动' : 'Create an event'})}"></head><body class="mingle-app">
<header th:replace="~{fragments/reference :: appNav('events')}"></header>
<main class="app-main event-form-wrap"><header class="page-heading"><h1 th:text="${#locale.language == 'zh' ? '发起活动' : 'Create an event'}"></h1><a class="text-link" th:href="@{/events}" th:text="${#locale.language == 'zh' ? '返回' : 'Back'}"></a></header>
 <form class="panel stack-form" th:action="@{/events}" th:object="${eventForm}" method="post">
  <div class="form-error" role="alert" th:if="${#fields.hasAnyErrors()}" th:text="${#locale.language == 'zh' ? '请检查填写内容，开始时间需要晚于现在。' : 'Check the fields below. Choose a future start time.'}"></div>
  <label for="title" th:text="${#locale.language == 'zh' ? '活动名称' : 'Event name'}"></label><input id="title" th:field="*{title}" required maxlength="140"><p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
  <label for="description" th:text="${#locale.language == 'zh' ? '活动详情' : 'Details'}"></label><textarea id="description" th:field="*{description}" rows="6" required maxlength="4000"></textarea><p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
  <div class="form-pair"><div><label for="category" th:text="${#locale.language == 'zh' ? '活动主题' : 'Topic'}"></label><select id="category" th:field="*{category}"><option th:each="item : ${allInterests}" th:value="${item}" th:text="${@i18n.option(item)}"></option></select><p class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p></div><div><label for="capacity" th:text="${#locale.language == 'zh' ? '人数上限' : 'Capacity'}"></label><input id="capacity" type="number" th:field="*{capacity}" min="2" max="100" required><p class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></p></div></div>
  <div class="form-pair"><div><label for="city" th:text="${#locale.language == 'zh' ? '城市' : 'City'}"></label><input id="city" th:field="*{city}" required maxlength="60"><p class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></p></div><div><label for="venue" th:text="${#locale.language == 'zh' ? '见面地点' : 'Venue'}"></label><input id="venue" th:field="*{venue}" required maxlength="120"><p class="field-error" th:if="${#fields.hasErrors('venue')}" th:errors="*{venue}"></p></div></div>
  <label for="startsAt" th:text="${#locale.language == 'zh' ? '开始时间（北京时间）' : 'Start time (China Standard Time)'}"></label><input id="startsAt" type="datetime-local" th:field="*{startsAt}" required><p class="field-error" th:if="${#fields.hasErrors('startsAt')}" th:errors="*{startsAt}"></p>
  <button class="button" type="submit" th:text="${#locale.language == 'zh' ? '发布活动' : 'Publish event'}"></button>
 </form>
</main></body></html>
