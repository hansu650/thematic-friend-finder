<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/reference :: head(${#locale.language == 'zh' ? '活动' : 'Events'})}"></head><body class="mingle-app events-page">
<header th:replace="~{fragments/reference :: appNav('events')}"></header>
<main class="app-main">
 <header class="page-heading"><h1 th:text="${#locale.language == 'zh' ? (eventView == 'saved' ? '我的收藏' : (eventView == 'going' ? '我报名的活动' : '一起见面。')) : (eventView == 'saved' ? 'Saved events' : (eventView == 'going' ? 'Your events' : 'Find your people.'))}"></h1><a class="button" th:href="@{/events/new}" th:text="${#locale.language == 'zh' ? '发起活动' : 'Create an event'}"></a></header>
 <form class="filter-form" th:action="@{/events}" method="get"><input type="hidden" name="view" th:value="${eventView}"><label class="sr-only" for="event-query" th:text="${#locale.language == 'zh' ? '活动关键词' : 'Search events'}"></label><input id="event-query" name="q" maxlength="120" th:value="${query}" th:placeholder="${#locale.language == 'zh' ? '搜索活动' : 'Search events'}"><label class="sr-only" for="event-city" th:text="${#locale.language == 'zh' ? '城市' : 'City'}"></label><input id="event-city" name="city" maxlength="60" th:value="${city}" th:placeholder="${#locale.language == 'zh' ? '城市' : 'City'}"><label class="sr-only" for="event-category" th:text="#{ui.interest}"></label><select id="event-category" name="category"><option value="" th:text="#{ui.all_interests}"></option><option th:each="item : ${allInterests}" th:value="${item}" th:text="${@i18n.option(item)}" th:selected="${item == category}"></option></select><button class="button" type="submit" th:text="${#locale.language == 'zh' ? '搜索' : 'Search'}"></button></form>
 <nav class="feed-filters" th:aria-label="${#locale.language == 'zh' ? '活动列表' : 'Event lists'}"><a class="topic-pill" th:classappend="${eventView.isEmpty()} ? 'selected'" th:href="@{/events(q=${query},city=${city},category=${category})}" th:text="${#locale.language == 'zh' ? '全部活动' : 'All events'}"></a><a class="topic-pill" th:classappend="${eventView == 'going'} ? 'selected'" th:href="@{/events(q=${query},city=${city},category=${category},view='going')}" th:text="${#locale.language == 'zh' ? '我参加的' : 'Going'}"></a><a class="topic-pill" th:classappend="${eventView == 'saved'} ? 'selected'" th:href="@{/events(q=${query},city=${city},category=${category},view='saved')}" th:text="${#locale.language == 'zh' ? '已收藏' : 'Saved'}"></a></nav>
 <div class="event-grid"><th:block th:each="item : ${events}"><a th:replace="~{fragments/event-card :: card(${item})}"></a></th:block><section class="feed-empty" th:if="${events.isEmpty()}"><h2 th:text="${#locale.language == 'zh' ? '这里还没有活动。' : 'No events here yet.'}"></h2><a class="button secondary" th:href="@{/events}" th:text="${#locale.language == 'zh' ? '浏览全部活动' : 'Browse all events'}"></a></section></div>
</main></body></html>
