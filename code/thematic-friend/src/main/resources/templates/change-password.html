<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{ui.change_password})}"></head><body>
<aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>
<div class="app-language"><nav th:replace="~{fragments/layout :: language}"></nav></div>
<main class="app-main"><header class="page-heading"><div><h1 th:text="#{ui.change_password}">Change password</h1><p class="muted" th:text="#{ui.password_change_hint}">After changing your password, sign in again.</p></div></header>
<section class="panel"><form th:action="@{/change-password}" th:object="${changePasswordForm}" method="post" class="stack-form">
<label for="currentPassword" th:text="#{ui.current_password}">Current password</label><input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required aria-describedby="currentPasswordError"><span id="currentPasswordError" class="field-error" th:errors="*{currentPassword}"></span>
<label for="newPassword" th:text="#{ui.new_password}">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required aria-describedby="newPasswordError"><span id="newPasswordError" class="field-error" th:errors="*{newPassword}"></span>
<label for="confirmation" th:text="#{ui.confirm_password}">Confirm new password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" required aria-describedby="confirmationError"><span id="confirmationError" class="field-error" th:errors="*{confirmation}"></span>
<button class="button" type="submit" th:text="#{ui.change_password}">Change password</button><a class="text-link" th:href="@{/profile}" th:text="#{ui.back_to_profile}">Back to profile</a></form></section></main></body></html>
