<!DOCTYPE html><html lang="en" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/reference :: head('Mingle')}"></head><body class="welcome-body">
<header th:replace="~{fragments/reference :: publicNav}"></header>
<main>
 <section class="home-hero" aria-labelledby="home-title">
  <img class="hero-poster" th:src="@{/images/reference-sites/feeld-poster.jpg}" alt="" fetchpriority="high">
  <video data-hero-video muted loop playsinline preload="metadata" th:poster="@{/images/reference-sites/feeld-poster.jpg}" aria-hidden="true"><source th:src="@{/images/reference-sites/feeld-hero.mp4}" type="video/mp4"></video>
  <h1 id="home-title" class="feeld-heading" lang="en"><span>A dating app</span><span>for the</span><span>curious.</span></h1>
  <div class="hero-actions"><div class="hero-community"><span class="avatar-stack" aria-hidden="true"><img th:src="@{/images/demo-portraits/portrait-02.jpg}" alt=""><img th:src="@{/images/demo-portraits/portrait-01.jpg}" alt=""><img th:src="@{/images/demo-portraits/portrait-03.jpg}" alt=""><img th:src="@{/images/demo-portraits/portrait-04.jpg}" alt=""></span><span th:text="${#locale.language == 'zh' ? '找到你的同好' : 'Find your community'}"></span></div><a class="hero-join" th:href="@{${me == null ? '/signup' : '/explore'}}"><span th:text="${#locale.language == 'zh' ? '开始探索' : 'Start exploring for free'}"></span><svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></a></div>
  <a class="hero-down" href="#our-approach" th:aria-label="${#locale.language == 'zh' ? '继续浏览' : 'Explore more'}"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></a>
  <button class="video-toggle" data-video-toggle type="button" hidden aria-pressed="false" th:aria-label="${#locale.language == 'zh' ? '暂停视频' : 'Pause video'}"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></button>
 </section>
 <section id="our-approach" class="hinge-section"><div class="hinge-editorial"><div class="hinge-copy"><h2 lang="en">Go on your<br>last first date.</h2></div><div class="hinge-description"><p th:text="${#locale.language == 'zh' ? '从共同兴趣开始，认识彼此。双方都想继续，再聊下去。也可以参加一场活动，在线下见面。' : 'Start with a shared interest. A mutual like opens a conversation. An event gives you a reason to meet in person.'}"></p><a class="hinge-link" th:href="@{/discover}" th:text="${#locale.language == 'zh' ? '认识新朋友' : 'Meet people'}"></a></div></div><img class="hinge-photo" th:src="@{/images/reference-sites/hinge-fountain.jpg}" alt="Two people talking beside a fountain" loading="lazy"></section>
 <section class="bumble-section"><h2 th:text="${#locale.language == 'zh' ? '一起见面。' : 'Meet in real life.'}"></h2><div class="bumble-products"><article class="bumble-product"><img th:src="@{/images/reference-sites/bumble-card-1.jpg}" alt="" loading="lazy"><h3 th:text="${#locale.language == 'zh' ? '认识新朋友' : 'Meet your people'}"></h3><a class="button" th:href="@{/discover}" th:text="${#locale.language == 'zh' ? '开始认识' : 'Meet people'}"></a></article><article class="bumble-product"><img th:src="@{/images/reference-sites/meetup-autumn.webp}" alt="" loading="lazy"><h3 th:text="${#locale.language == 'zh' ? '参加一场活动' : 'Find an event'}"></h3><a class="button" th:href="@{/events}" th:text="${#locale.language == 'zh' ? '浏览活动' : 'Browse events'}"></a></article></div></section>
</main><footer th:replace="~{fragments/reference :: footer}"></footer></body></html>
